name: Timeflow Selenium CI/CD Regression Suite

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Run nightly regression at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Target Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      headless:
        description: 'Run in Headless Mode'
        required: true
        default: true
        type: boolean
      suite:
        description: 'Target TestNG Suite / XML file'
        required: false
        default: 'testng.xml'
        type: string

jobs:
  selenium-tests:
    name: Selenium Automated Regression (${{ inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: |
          chmod +x mvnw
          chmod +x run-all-tests.sh || true

      - name: Verify Environment & Tools
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Maven Version ==="
          ./mvnw -version
          echo "=== Chrome Version ==="
          google-chrome --version || which google-chrome || echo "Chrome not directly found"

      - name: Execute TestNG Regression Suite
        id: run_tests
        run: |
          BROWSER="${{ inputs.browser || 'chrome' }}"
          HEADLESS="${{ inputs.headless != '' && inputs.headless || 'true' }}"
          SUITE="${{ inputs.suite || 'testng.xml' }}"
          
          echo "Executing test suite: $SUITE on browser: $BROWSER (headless: $HEADLESS)"
          ./mvnw clean test -Dbrowser="$BROWSER" -Dheadless="$HEADLESS" -Dsurefire.suiteXmlFiles="$SUITE"
        continue-on-error: true

      - name: Generate Job Summary Report
        if: always()
        run: |
          echo "## 📊 Timeflow Selenium Automation Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.run_tests.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser**: \`${{ inputs.browser || 'chrome' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Headless**: \`${{ inputs.headless != '' && inputs.headless || 'true' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Suite**: \`${{ inputs.suite || 'testng.xml' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "target/surefire-reports" ]; then
            echo "### 📋 TestNG Execution Results" >> $GITHUB_STEP_SUMMARY
            echo "Surefire reports were generated and uploaded to pipeline artifacts." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Surefire HTML & XML Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeflow-surefire-reports
          path: |
            target/surefire-reports/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Test Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeflow-failure-screenshots
          path: |
            target/screenshots/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Enforce Job Outcome
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "Test suite failed. Please inspect the attached Surefire reports and failure screenshots."
          exit 1
